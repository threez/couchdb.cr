name: CI

on: [push, pull_request]

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - run: shards install
      - run: make lint spec
      - run: crystal tool format --check src/ spec/

  verify-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install crystal
      - run: shards install
      - run: make spec

  e2e:
    runs-on: ubuntu-latest
    env:
      COUCHDB_URL: http://admin:secret@localhost:7070
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/goydb/goydb/cmd/goydb@latest
      - run: shards install
      - name: Start goydb
        run: |
          mkdir -p /tmp/goydb-dbs /tmp/goydb-public
          goydb -addr :7070 -admins "admin:secret" -dbs /tmp/goydb-dbs -public /tmp/goydb-public &
      - name: Wait for goydb
        run: timeout 30 bash -c 'until curl -sf http://localhost:7070/; do sleep 1; done'
      - run: make e2e
