name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: ${{ runner.os }}-shards-

      - run: shards install

      - name: Build ameba
        run: crystal build lib/ameba/src/cli.cr -o lib/ameba/bin/ameba

      - name: Format check
        run: crystal tool format --check

      - name: Ameba lint
        run: lib/ameba/bin/ameba

      - name: Compile check
        run: crystal build src/couchdb.cr -o /tmp/couchdb_check --no-codegen

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2

      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: ${{ runner.os }}-shards-

      - run: shards install

      - name: Run specs
        run: crystal spec --order=random

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: brew install crystal
      - run: shards install
      - run: make spec

  e2e:
    name: E2E (goydb)
    runs-on: ubuntu-latest
    needs: lint
    env:
      COUCHDB_URL: http://admin:secret@localhost:7070
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/goydb/goydb/cmd/goydb@latest
      - run: shards install
      - name: Start goydb
        run: |
          mkdir -p /tmp/goydb-dbs /tmp/goydb-public
          goydb -addr :7070 -admins "admin:secret" -dbs /tmp/goydb-dbs -public /tmp/goydb-public &
      - name: Wait for goydb
        run: timeout 30 bash -c 'until curl -sf http://localhost:7070/; do sleep 1; done'
      - run: make e2e
